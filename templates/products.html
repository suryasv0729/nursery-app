{% extends "base.html" %}

{% block title %}Shop Plants | Nursery App{% endblock %}

{% block content %}
<div class="bg-gray-50 py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row gap-8">
        
        <!-- Sidebar Filters -->
        <div class="w-full md:w-64 flex-shrink-0">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 sticky top-24">
                <h3 class="font-semibold text-lg mb-4 text-gray-900 border-b pb-2">Filters</h3>
                
                <div class="mb-6">
                    <h4 class="text-sm font-medium text-gray-700 mb-3">Categories</h4>
                    <div class="space-y-2 text-sm" id="category-filters">
                        <label class="flex items-center space-x-2 text-gray-600 cursor-pointer">
                            <input type="radio" name="category" value="all" class="text-green-600 ring-green-500" checked>
                            <span>All Plants</span>
                        </label>
                        <label class="flex items-center space-x-2 text-gray-600 cursor-pointer">
                            <input type="radio" name="category" value="Indoor" class="text-green-600 ring-green-500">
                            <span>Indoor</span>
                        </label>
                        <label class="flex items-center space-x-2 text-gray-600 cursor-pointer">
                            <input type="radio" name="category" value="Outdoor" class="text-green-600 ring-green-500">
                            <span>Outdoor</span>
                        </label>
                        <label class="flex items-center space-x-2 text-gray-600 cursor-pointer">
                            <input type="radio" name="category" value="Succulents" class="text-green-600 ring-green-500">
                            <span>Succulents</span>
                        </label>
                        <label class="flex items-center space-x-2 text-gray-600 cursor-pointer">
                            <input type="radio" name="category" value="Flowers" class="text-green-600 ring-green-500">
                            <span>Flowers</span>
                        </label>
                        <label class="flex items-center space-x-2 text-gray-600 cursor-pointer">
                            <input type="radio" name="category" value="Herbs" class="text-green-600 ring-green-500">
                            <span>Herbs</span>
                        </label>
                        <label class="flex items-center space-x-2 text-gray-600 cursor-pointer">
                            <input type="radio" name="category" value="Trees" class="text-green-600 ring-green-500">
                            <span>Trees</span>
                        </label>
                        <label class="flex items-center space-x-2 text-gray-600 cursor-pointer">
                            <input type="radio" name="category" value="Organic Pesticides" class="text-green-600 ring-green-500">
                            <span>Organic Pesticides</span>
                        </label>
                        <label class="flex items-center space-x-2 text-gray-600 cursor-pointer">
                            <input type="radio" name="category" value="Seeds" class="text-green-600 ring-green-500">
                            <span>Seeds</span>
                        </label>
                        <label class="flex items-center space-x-2 text-gray-600 cursor-pointer">
                            <input type="radio" name="category" value="Pots" class="text-green-600 ring-green-500">
                            <span>Pots</span>
                        </label>
                    </div>
                </div>
                
                <div>
                    <h4 class="text-sm font-medium text-gray-700 mb-3">Sort By</h4>
                    <select id="sort-filter" class="w-full border-gray-300 rounded-lg text-sm focus:ring-green-500 focus:border-green-500 bg-gray-50 py-2 px-3">
                        <option value="newest">Newest First</option>
                        <option value="price_low">Price: Low to High</option>
                        <option value="price_high">Price: High to Low</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Product Grid -->
        <div class="flex-grow">
            <!-- Search Bar -->
            <div class="mb-6 flex gap-4">
                <div class="relative flex-grow">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-search text-gray-400"></i>
                    </div>
                    <input type="text" id="search-input" placeholder="Search for plants..." class="pl-10 block w-full border-gray-300 rounded-xl py-3 px-4 shadow-sm focus:ring-green-500 focus:border-green-500">
                </div>
            </div>

            <!-- Loader -->
            <div id="loader" class="py-20 text-center">
                <i class="fa-solid fa-spinner fa-spin text-green-600 text-4xl"></i>
            </div>
            
            <!-- Products -->
            <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
                <!-- Injected via JS -->
            </div>
            
            <div id="no-products" class="hidden py-20 text-center text-gray-500">
                <i class="fa-solid fa-leaf text-4xl mb-4 text-gray-300"></i>
                <p>No products found.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
<script>
    let allProducts = [];
    
    document.addEventListener('DOMContentLoaded', async () => {
        await loadProducts();
        
        // Listeners for filters
        document.getElementById('search-input').addEventListener('input', renderProducts);
        document.getElementById('sort-filter').addEventListener('change', renderProducts);
        document.querySelectorAll('input[name="category"]').forEach(el => {
            el.addEventListener('change', renderProducts);
        });
    });
    
    async function loadProducts() {
        const {ok, data} = await apiCall('/api/products/');
        document.getElementById('loader').classList.add('hidden');
        if(ok && Array.isArray(data)) {
            allProducts = data;
            renderProducts();
        } else {
            document.getElementById('no-products').classList.remove('hidden');
        }
    }
    
    function renderProducts() {
        const grid = document.getElementById('products-grid');
        const noProds = document.getElementById('no-products');
        
        let filtered = [...allProducts];
        
        // Search
        const query = document.getElementById('search-input').value.toLowerCase();
        if(query) {
            filtered = filtered.filter(p => p.name.toLowerCase().includes(query) || p.category.toLowerCase().includes(query));
        }
        
        // Category
        const cat = document.querySelector('input[name="category"]:checked').value;
        if(cat !== 'all') {
            filtered = filtered.filter(p => p.category === cat);
        }
        
        // Sort
        const sort = document.getElementById('sort-filter').value;
        if(sort === 'price_low') filtered.sort((a,b) => parseFloat(a.price) - parseFloat(b.price));
        else if(sort === 'price_high') filtered.sort((a,b) => parseFloat(b.price) - parseFloat(a.price));
        else filtered.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
        
        if(filtered.length === 0) {
            grid.classList.add('hidden');
            noProds.classList.remove('hidden');
        } else {
            noProds.classList.add('hidden');
            grid.classList.remove('hidden');
            
            let html = '';
            filtered.forEach(p => {
                const imageUrl = p.image_url || 'https://images.unsplash.com/photo-1498814117408-e396f6259ce2?auto=format&fit=crop&w=500&q=80';
                html += `
                <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden product-card tilt-card relative group" style="transform-style: preserve-3d; will-change: transform;">
                    <button onclick="toggleWishlist(${p.id}, this)" class="absolute top-3 right-3 z-10 w-9 h-9 bg-white/80 backdrop-blur rounded-full flex items-center justify-center shadow hover:bg-white text-gray-400 hover:text-red-500 transition" style="transform: translateZ(50px)">
                        <i class="fa-regular fa-heart text-sm"></i>
                    </button>
                    <a href="/product/${p.id}" class="block overflow-hidden h-56">
                        <img src="${imageUrl}" class="w-full h-full object-cover transform transition duration-700 tilt-image">
                    </a>
                    <div class="p-5" style="transform: translateZ(20px)">
                        <div class="text-xs font-semibold text-green-600 mb-1 tracking-wider uppercase">${p.category}</div>
                        <a href="/product/${p.id}" class="block text-lg font-bold text-gray-900 mb-2 truncate transition" style="transform: translateZ(30px)">${p.name}</a>
                        <div class="flex items-center justify-between mt-4" style="transform: translateZ(40px)">
                            <span class="text-xl font-bold text-gray-900">₹${parseFloat(p.price).toFixed(2)}</span>
                            <button onclick="addToCart(${p.id})" class="bg-gray-900 text-white w-10 h-10 rounded-full flex items-center justify-center hover:bg-green-600 transition shadow-md">
                                <i class="fa-solid fa-plus overflow-hidden"></i>
                            </button>
                        </div>
                    </div>
                </div>
                `;
            });
            grid.innerHTML = html;
            
            // Initialize 3D Vanilla Tilt effect after rendering
            if (typeof VanillaTilt !== 'undefined') {
                VanillaTilt.init(document.querySelectorAll('.tilt-card'), {
                    max: 15,
                    speed: 400,
                    glare: true,
                    "max-glare": 0.3,
                    scale: 1.05
                });
            }
        }
    }
</script>
{% endblock %}
