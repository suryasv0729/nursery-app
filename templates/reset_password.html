{% extends "base.html" %}

{% block title %}Reset Password | Nursery App{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
            Set New Password
        </h2>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
            <form id="reset-password-form">
                <input type="hidden" id="reset-token" value="{{ token }}">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
                    <input type="password" id="new-password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password</label>
                    <input type="password" id="confirm-new-password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition">
                </div>
                <button type="submit" id="submit-reset-btn" class="w-full bg-green-600 text-white font-medium py-3 rounded-lg hover:bg-green-700 transition shadow">
                    Reset Password
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('reset-password-form').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submit-reset-btn');
        const password = document.getElementById('new-password').value;
        const confirm = document.getElementById('confirm-new-password').value;
        const token = document.getElementById('reset-token').value;
        
        if (password !== confirm) {
            showToast('Passwords do not match.', 'error');
            return;
        }
        
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
        btn.disabled = true;
        
        const {ok, data} = await apiCall('/api/auth/reset-password', {
            method: 'POST',
            body: JSON.stringify({ token, password })
        });
        
        btn.innerHTML = 'Reset Password';
        btn.disabled = false;
        
        if (ok) {
            showToast('Password reset successful! Redirecting...', 'success');
            setTimeout(() => {
                window.location.href = '/';
            }, 2000);
        } else {
            showToast(data.message || 'Expired or invalid link. Try sending a forgot password request again.', 'error');
        }
    }
</script>
{% endblock %}
